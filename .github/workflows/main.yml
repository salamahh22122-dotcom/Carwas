name: Build Car Wash Management APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Node.js 20
      # ==========================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "**/package-lock.json"

      # ==========================================
      # 3. Setup Java JDK 21
      # ==========================================
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==========================================
      # 4. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 5. Install Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          yes | sdkmanager --licenses || true

      # ==========================================
      # 6. Find ZIP project
      # ==========================================
      - name: Find project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            \( -iname "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP proyek tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 7. Extract ZIP
      # ==========================================
      - name: Extract project ZIP
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Struktur hasil extract:"
          find project -maxdepth 3 -type f | head -150

      # ==========================================
      # 8. Find package.json
      # ==========================================
      - name: Find Node project
        shell: bash
        run: |
          PACKAGE_JSON=$(find project \
            -type f \
            -name "package.json" \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json ditemukan:"
          echo "$PACKAGE_JSON"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 9. Show Node / Java versions
      # ==========================================
      - name: Verify build environment
        run: |
          echo "Node:"
          node --version

          echo "NPM:"
          npm --version

          echo "Java:"
          java -version

      # ==========================================
      # 10. Install dependencies
      # ==========================================
      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install --no-audit --no-fund

      # ==========================================
      # 11. Force Capacitor 7
      # ==========================================
      - name: Install Capacitor 7
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install \
            @capacitor/core@7 \
            @capacitor/android@7 \
            @capacitor/cli@7 \
            --save-exact \
            --no-audit \
            --no-fund

      # ==========================================
      # 12. Verify Capacitor version
      # ==========================================
      - name: Verify Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Capacitor version:"
          npx cap --version

          node --version

      # ==========================================
      # 13. Build React/Vite
      # ==========================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # ==========================================
      # 14. Create Android project
      # ==========================================
      - name: Create Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android

      # ==========================================
      # 15. Sync web build to Android
      # ==========================================
      - name: Sync Capacitor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      # ==========================================
      # 16. Verify Android project
      # ==========================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -d android
          test -f android/gradlew
          test -f android/settings.gradle

          echo "Android project berhasil dibuat."

      # ==========================================
      # 17. Build Debug APK
      # ==========================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 18. Prepare APK
      # ==========================================
      - name: Prepare APK artifact
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          mkdir -p release

          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK_PATH" ]; then
            echo "ERROR: APK tidak ditemukan."
            echo "Mencari semua APK:"
            find android -type f -name "*.apk"
            exit 1
          fi

          cp "$APK_PATH" \
            "release/car-wash-management-debug.apk"

          echo "APK berhasil dibuat:"
          ls -lh release/car-wash-management-debug.apk

      # ==========================================
      # 19. Upload APK
      # ==========================================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-wash-management-apk
          path: ${{ env.PROJECT_DIR }}/release/car-wash-management-debug.apk
          if-no-files-found: error
          retention-days: 30
