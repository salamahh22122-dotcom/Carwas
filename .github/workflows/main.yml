name: Build Car Wash Management APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

jobs:
  build-apk:
    runs-on: ubuntu-latest

    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Node.js 20
      # ==========================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      # ==========================================
      # 3. Java JDK 21
      # ==========================================
      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # ==========================================
      # 4. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 5. Android SDK packages
      # ==========================================
      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

      # ==========================================
      # 6. Verify environment
      # ==========================================
      - name: Verify environment
        run: |
          echo "=============================="
          echo "NODE"
          echo "=============================="
          node --version

          echo "=============================="
          echo "NPM"
          echo "=============================="
          npm --version

          echo "=============================="
          echo "JAVA"
          echo "=============================="
          java -version

      # ==========================================
      # 7. Find ZIP
      # ==========================================
      - name: Find project ZIP
        shell: bash
        run: |
          ZIP_FILE=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: File ZIP proyek tidak ditemukan."
            exit 1
          fi

          echo "ZIP ditemukan:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # ==========================================
      # 8. Extract ZIP
      # ==========================================
      - name: Extract project ZIP
        shell: bash
        run: |
          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Isi proyek:"
          find project -maxdepth 3 -type f | head -150

      # ==========================================
      # 9. Find package.json
      # ==========================================
      - name: Locate package.json
        shell: bash
        run: |
          PACKAGE_JSON=$(find project \
            -type f \
            -name "package.json" \
            | head -n 1)

          if [ -z "$PACKAGE_JSON" ]; then
            echo "ERROR: package.json tidak ditemukan."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PACKAGE_JSON")

          echo "package.json:"
          echo "$PACKAGE_JSON"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # 10. Install dependencies
      # ==========================================
      - name: Install npm dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install \
            --no-audit \
            --no-fund

      # ==========================================
      # 11. Force Capacitor 7
      # ==========================================
      - name: Install Capacitor 7
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm install \
            @capacitor/core@7 \
            @capacitor/android@7 \
            @capacitor/cli@7 \
            --save-exact \
            --no-audit \
            --no-fund

      # ==========================================
      # 12. Verify Capacitor
      # ==========================================
      - name: Verify Capacitor version
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "Capacitor:"
          npx cap --version

          echo "Node:"
          node --version

      # ==========================================
      # 13. Build Vite
      # ==========================================
      - name: Build web application
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npm run build

      # ==========================================
      # 14. Create Android project
      # ==========================================
      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap add android

      # ==========================================
      # 15. Sync Capacitor
      # ==========================================
      - name: Sync Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          npx cap sync android

      # ==========================================
      # 16. Verify Android project
      # ==========================================
      - name: Verify Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Folder android tidak ditemukan."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERROR: Gradle wrapper tidak ditemukan."
            exit 1
          fi

          echo "Android project OK."

      # ==========================================
      # 17. Build APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew

          ./gradlew \
            assembleDebug \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 18. Find APK
      # ==========================================
      - name: Find generated APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "Mencari APK..."

          find android \
            -type f \
            -name "*.apk" \
            -print

          APK_PATH=$(find android \
            -type f \
            -name "app-debug.apk" \
            | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "ERROR: APK tidak berhasil dibuat."
            exit 1
          fi

          echo "APK ditemukan:"
          echo "$APK_PATH"

          echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

      # ==========================================
      # 19. Prepare APK
      # ==========================================
      - name: Prepare APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p release

          cp "$APK_PATH" \
            release/car-wash-management-debug.apk

          echo "APK siap:"
          ls -lh release/

      # ==========================================
      # 20. Upload APK Artifact
      # ==========================================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-wash-management-apk
          path: ${{ env.PROJECT_DIR }}/release/car-wash-management-debug.apk
          if-no-files-found: error
          retention-days: 30
