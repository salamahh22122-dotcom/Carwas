name: Build Car Wash Management

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: car-wash-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Show tool versions
        run: |
          node --version
          npm --version
          java -version

      - name: Find project ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP_FILE="$(find . -maxdepth 2 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "Tidak ditemukan file ZIP proyek."
            exit 1
          fi
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract project ZIP
        shell: bash
        run: |
          rm -rf app
          mkdir -p app
          unzip -q "$ZIP_FILE" -d app

          shopt -s dotglob nullglob
          entries=(app/*)
          if [ "${#entries[@]}" -eq 1 ] && [ -d "${entries[0]}" ] && [ -f "${entries[0]}/package.json" ]; then
            tmp_dir="$(mktemp -d)"
            cp -a "${entries[0]}"/. "$tmp_dir"/
            rm -rf app
            mv "$tmp_dir" app
          fi

          test -f app/package.json

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build production
        working-directory: app
        env:
          CI: "true"
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: car-wash-management-dist
          path: app/dist
          if-no-files-found: error
          retention-days: 14
